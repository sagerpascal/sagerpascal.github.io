<a class="skip-link" href="#main">Skip to content</a>

<nav class="nav" id="nav">
    <div class="nav-inner shell">
        <a class="nav-brand" href="/">
            <span class="dot" aria-hidden="true"></span>
            Pascal Sager
        </a>

        <ul class="nav-links" id="nav-links">
            {% for item in site.data.navigation %}
            <li><a href="{{ item.url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
            {% endfor %}
        </ul>

        <div class="nav-actions">
            <button class="icon-btn theme-toggle" id="theme-switch-button" type="button" aria-label="Switch colour theme">
                {% include icon.html name="sun" class="icon-sun" %}
                {% include icon.html name="moon" class="icon-moon" %}
            </button>
            <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
                {% include icon.html name="menu" class="icon-open" %}
            </button>
        </div>
    </div>
</nav>
