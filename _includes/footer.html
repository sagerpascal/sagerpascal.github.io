<footer class="footer">
    <div class="shell">
        <div class="footer-grid">
            <div class="footer-note">
                <div>{{ site.author.name }}</div>
                <div>&copy; {{ 'now' | date: '%Y' }} &middot; Zurich &amp; Winterthur</div>
                <div><a href="{{ site.repo }}">Source on GitHub</a></div>
            </div>

            <div class="social">
                {% for link in site.data.social %}
                <a href="{{ link.url }}" target="_blank" rel="noopener" title="{{ link.name }}">
                    {% include icon.html name=link.icon label=link.name %}
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</footer>
