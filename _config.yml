# Site settings
title: 'Pascal Sager'
description: 'Co-founder and CTO at Binabik AI, PhD candidate in artificial intelligence at ZHAW and the ETH AI Center.'
url: 'https://sagerpascal.github.io'
permalink: pretty
lang: en

author:
  name: Pascal Sager
  email: pascal@binabik.ai

repo: https://github.com/sagerpascal/sagerpascal.github.io

markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

# Keep the build output lean.
exclude:
  - .claude/
  - .idea/
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  # Draft archive: not published, kept for reference.
  - _old_posts/

collections:
  projects:
    output: true
    permalink: /work/:name/
  # Unlisted long-form writing. Reachable by URL, absent from search engines,
  # the sitemap and every link on the public site.
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: notes }
    values:
      layout: essay
      sitemap: false
      noindex: true
